name: CI/CD Pipeline

on:
  push:
    branches:
      - Production
  pull_request:
    branches:
      - Production

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release

  deploy-production:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/Production'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /var/www/prod-app
            # 1. GitHub સાથે કોડ સિંક કરો
            sudo git fetch origin Production
            sudo git reset --hard origin/Production
            sudo rm -f *.json *.dll *.exe *.config *.pdb
            
            # 3. ચોક્કસ પ્રોજેક્ટ ફાઇલ પબ્લિશ કરો
            sudo dotnet publish MyTestAPI.csproj -c Release -o .
            
            # 4. સર્વિસ રિસ્ટાર્ટ કરો
            sudo systemctl restart prod-app.service
